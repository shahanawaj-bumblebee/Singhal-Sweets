{% extends "base.html" %}

{% block content %}
<div style="max-width:400px;margin:80px auto;">
    <h2 style="text-align:center;">Create Account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
        style="background:#ffcc00;color:black;padding:10px 20px;border:none;border-radius:5px;width:100%;">
            Register
        </button>
    </form>
</div>
{% endblock %}
